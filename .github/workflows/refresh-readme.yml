name: Refresh README

on:
  schedule:
    # Hourly so the greeting follows my time of day. The API is only called when the daypart changes.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Greeting for my time of day
        env:
          GETMEME_API_KEY: ${{ secrets.GETMEME_API_KEY }}
          GETMEME_URL: ${{ vars.GETMEME_URL }}
          GREETING_TZ: ${{ vars.GREETING_TZ }}
        run: python3 scripts/greeting.py

      - name: Building right now, and the contribution calendar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Read-only tokens and the private-repo labels. All three are repo secrets,
          # so private repo names never appear in this public repo.
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          CURRENTLY_PRIVATE: ${{ secrets.CURRENTLY_PRIVATE }}
          GREETING_TZ: ${{ vars.GREETING_TZ }}
        # Once a day: the first run from 10:00 UTC whose calendar doesn't show today yet.
        # The window runs to 13:59 because scheduled runs are sometimes late. Manual runs always redraw.
        run: |
          today="$(date -u '+%b %-d, %Y')"
          hour="$(date -u +%-H)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || \
             { [ "$hour" -ge 10 ] && [ "$hour" -le 13 ] && ! grep -q "on $today</title>" assets/calendar-dark.svg; }; then
            python3 scripts/update_currently.py || echo "::warning::Project cards not updated"
            python3 scripts/contrib_calendar.py || echo "::warning::Contribution calendar not updated"
          else
            echo "Already drawn today, or not its time yet; skipping."
          fi

      - name: Commit if anything changed
        run: |
          # Stage first: the calendar SVGs are new files on the first run, and git diff ignores untracked files.
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh greeting, project cards and calendar"
          git push
