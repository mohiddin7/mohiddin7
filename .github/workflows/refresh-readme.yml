name: Refresh README

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Greeting of the day
        env:
          GETMEME_API_KEY: ${{ secrets.GETMEME_API_KEY }}
          GETMEME_URL: ${{ vars.GETMEME_URL }}
        run: python3 scripts/greeting.py

      - name: Currently working on
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional read-only tokens and the private-repo labels. All three are
          # repo secrets, so private repo names never appear in this public repo.
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          CURRENTLY_PRIVATE: ${{ secrets.CURRENTLY_PRIVATE }}
        run: python3 scripts/update_currently.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh greeting and work log"
          git push
